<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Limb Home</title>
  <link rel="stylesheet" href="chrome://browser/content/limb/home/limb-home.css" />
</head>
<body>
  <div id="launcher">
    <div id="search-container">
      <input id="search-bar" type="text" placeholder="Search history..." autocomplete="off" />
      <button id="settings-gear" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.1 3.1l1.4 1.4M13.5 13.5l1.4 1.4M3.1 14.9l1.4-1.4M13.5 4.5l1.4-1.4"/>
        </svg>
      </button>
    </div>

    <div id="empty-state" hidden>
      <button id="start-browsing">Start Browsing</button>
    </div>

    <div id="branches-container"></div>

    <button id="new-branch" title="New branch">+</button>
  </div>

  <script type="module" src="chrome://browser/content/limb/home/limb-home.mjs"></script>
</body>
</html>
