<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Limb Settings</title>
  <link rel="stylesheet" href="chrome://browser/content/limb/settings/limb-settings.css" />
</head>
<body>
  <div id="settings">
    <h1>Settings</h1>

    <section class="settings-section">
      <h2>General</h2>

      <div class="setting-row">
        <label for="homepage">Homepage</label>
        <input id="homepage" type="text" autocomplete="off" />
      </div>

      <div class="setting-row">
        <label for="max-live-tabs">Max Live Tabs</label>
        <input id="max-live-tabs" type="number" min="1" max="12" />
      </div>
    </section>
  </div>

  <script type="module" src="chrome://browser/content/limb/settings/limb-settings.mjs"></script>
</body>
</html>
